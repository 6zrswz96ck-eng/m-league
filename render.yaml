services:
  - type: web
    name: m-league-scores
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /up
    disk:
      name: league-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: LEAGUE_ADMIN_USER
        value: admin
      - key: LEAGUE_ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: APP_LOCALE
        value: ja
